# Portão de entrada: roda em todo push na main e em todo pull request.
#
# # O que este workflow garante
#
# Ele não tem receita própria. Cada passo é um alvo do Makefile — o mesmo que
# quem desenvolve roda antes de commitar. Duplicar os comandos aqui deixaria as
# duas receitas divergirem em silêncio, e a divergência apareceria como uma CI
# verde sobre um repositório que falha na máquina de alguém (é o mesmo
# princípio do release.yml, que também não constrói nada por conta própria).
#
# `make verify` é o alvo PADRÃO do projeto (`all: verify`) e cobre o que foi
# pedido de uma vez: gofmt, `go vet`, os testes unitários e a CONFIRMAÇÃO de
# que o binário saiu estático — não a presunção.
#
# # A suíte de cenários: fora do PR, DENTRO da main e da noite
#
# Ela puxa quatro imagens do Docker Hub e tem casos que sobem uma microVM com
# qemu. Num portão de pull request isso é um gate que falha por rate limit de
# terceiro ou por ausência de KVM no runner, sem nada de errado com o código —
# e um gate que falha sozinho é um gate que as pessoas aprendem a ignorar.
#
# Só que a alternativa que estava valendo era não rodar em lugar NENHUM, e o
# preço disso foi medido: a suíte ficou vermelha por volta de noventa commits
# sem ninguém saber. Um gate ruidoso é ruim; um gate ausente é pior, porque a
# regressão não fica sem veredito — ela fica com o veredito errado.
#
# Então ela roda no tier de CONTÊINER (sem KVM: os casos de microVM se pulam
# sozinhos, com o motivo dito), no push da main e toda noite. É onde a
# flakiness não bloqueia ninguém e a regressão aparece em até um dia, em vez de
# em três meses.
#
# O que continua fora: o tier de microVM, que exige KVM que o runner não tem, e
# o gate de pull request. Um subconjunto HERMÉTICO — que rodasse no PR sem
# puxar imagem nem subir VM — não existe hoje: todo cenário executável ou usa
# uma imagem de contêiner ou é `Mode: VM`. Criá-lo é decidir uma feature nova
# no arcabouço de cenários, e não configurar CI.
#
# A consequência precisa ficar dita, e não descoberta: o detector de corrida
# aqui roda sobre `internal/` e `cmd/`, e NÃO sobre os cenários — que foi
# exatamente onde uma corrida se escondeu uma vez. Antes de tag, `make race`
# roda os dois lados.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A noite é para a suíte de cenários. 04:17 UTC e não 04:00: horário redondo é
  # onde o agendador do GitHub acumula fila.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior: o que importa é o
# veredito sobre o ÚLTIMO commit, e manter as antigas vivas só gasta fila.
# A main fica de fora do cancelamento — ali cada commit merece seu veredito.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # gofmt + go vet + testes + binário estático CONFIRMADO.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # A versão vem do go.mod: uma cópia do número aqui envelheceria sem
          # ninguém perceber, e a CI passaria a testar com outro compilador.
          #
          # Precisa ser setup-go v6+: o parseGoVersionFile do v5 casa SÓ
          # `^go (\d+...)` e ignora a diretiva `toolchain`. Com o v5 o runner
          # instalava 1.25.x e o próprio Go baixava o 1.26.5 depois, por
          # toolchain switching — o build acabava certo, mas por um segundo
          # mecanismo implícito, enquanto este comentário afirmava que a fonte
          # única era o go.mod. Agora é.
          go-version-file: go.mod
          cache: true

      - name: verify
        run: make verify

  # O detector de corrida exige cgo, e por isso é alvo separado: o CGO_ENABLED=0
  # do topo do Makefile vale para o arquivo inteiro, e sem a concessão local o
  # comando morre em "requires cgo" sem rodar teste nenhum.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: race (unitários — a suíte de cenários NÃO entra aqui)
        run: make race-unit

  # Cross-compilação das outras duas arquiteturas.
  #
  # Existe porque o `verify` compila só a do runner, e a propriedade que
  # justificou escolher Go — binário estático, sem libc do host — se perde por
  # um `import` novo que puxe cgo. Hoje isso só é conferido no release, ou seja,
  # DEPOIS de a tag existir: um PR que quebra o arm64 passaria batido até lá.
  # Cross-compilar custa segundos e move a descoberta para o pull request.
  arches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: compilar 386 e arm64
        run: make arches

      - name: confirmar que continuam estáticos
        run: |
          for b in dist/aletheia-386 dist/aletheia-arm64; do
            file "$b"
            file "$b" | grep -q "statically linked" || {
              echo "FALHA: $b não é estático — algum import puxou cgo" >&2
              exit 1
            }
          done

  # A suíte de cenários, no tier que cabe num runner: contêiner, sem KVM.
  #
  # NÃO roda em pull request — ver o cabeçalho deste arquivo. Roda no push da
  # main e no agendamento noturno, que é o que impede a suíte de ficar vermelha
  # por meses sem veredito.
  scenarios:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Ela sobe contêineres e exporta rootfs; o teto do `go test` é 10m, e este é
    # o do job inteiro, com folga para os pulls.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # O PULL É UM PASSO SEPARADO, e com retry, para que "o Docker Hub limitou"
      # não se pareça com "o código quebrou".
      #
      # As duas falhas exigem coisas diferentes de quem olha: uma se resolve
      # rodando de novo, a outra é uma regressão. Deixá-las sair pelo mesmo
      # vermelho, no meio da saída da suíte, é o que faz as pessoas pararem de
      # ler o vermelho.
      - name: puxar as imagens do tier de contêiner
        run: |
          for img in debian:12 debian:9 centos:7 alpine:3.20; do
            for tentativa in 1 2 3; do
              if docker pull --quiet "$img"; then
                continue 2
              fi
              echo "pull de $img falhou (tentativa $tentativa/3)" >&2
              sleep $((tentativa * 15))
            done
            echo "INFRAESTRUTURA: não foi possível puxar $img do Docker Hub." >&2
            echo "Isto NÃO é uma falha do código — é limite de taxa ou rede." >&2
            exit 1
          done

      - name: cenários (tier de contêiner; os de microVM se pulam sem KVM)
        run: make scenarios-container
