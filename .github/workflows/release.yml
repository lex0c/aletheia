# Publica os binários de uma versão.
#
# Dispara ao empurrar uma tag `v*`. O `workflow_dispatch` existe para ensaiar o
# build inteiro sem publicar nada — útil antes de criar a tag de verdade.
#
# # O que este workflow garante
#
# O artefato publicado é o mesmo que `make dist` produz na máquina de quem
# desenvolve: o workflow NÃO tem uma linha de build própria. Duplicar o comando
# aqui deixaria as duas receitas divergirem em silêncio, e a divergência
# apareceria como um binário que se comporta diferente do que foi testado.
#
# E ele não publica nada que não tenha passado pelas próprias invariantes do
# projeto — um passo `make verify` roda ANTES do `make dist` (vet, os testes
# unitários e a CONFIRMAÇÃO de que o binário é estático). Antes esse gate era
# carona do `dist`; agora é passo próprio, porque `make dist` só constrói — para
# não rodar a suíte inteira em toda build local de quem desenvolve.
#
# # O que ele NÃO roda, e por quê
#
# A suíte de cenários (`make scenarios`) fica de fora do caminho de release. Ela
# sobe contêineres de quatro distribuições e uma microVM, e o que ela testa é o
# comportamento contra /proc de verdade — não o artefato. Colocá-la aqui
# amarraria a publicação de uma versão à disponibilidade do Docker Hub e à
# presença de qemu no runner: um release bloqueado por infraestrutura de
# terceiro, sem nada de errado com o código.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# O topo fica no MÍNIMO. A escrita e as duas permissões de atestação são
# declaradas no job que precisa delas — assim, um segundo job acrescentado
# depois não herda poder de publicar sem que alguém tenha decidido isso.
permissions:
  contents: read

# Publicação não se cancela pela metade: um release interrompido entre o upload
# do binário e o do SHA256SUMS deixa a tag com meia entrega.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # criar o release e subir os artefatos
      id-token: write     # OIDC para a proveniência (Sigstore)
      attestations: write # gravar a atestação no repositório
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As TAGS são necessárias: `make repro` tira a versão de
          # `git describe --exact-match`, que é o que tira do usuário a chance
          # de digitar a versão errada ao conferir o release.
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # A versão vem do go.mod: uma cópia do número aqui envelheceria sem
          # ninguém perceber, e a build de release usaria outro compilador.
          go-version-file: go.mod
          cache: true

      - name: versão
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # Ensaio: a versão diz o que é, para nunca ser confundida com um
            # release. Ela é embutida no binário e sai no `aletheia version`.
            v="0.0.0-ensaio-$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publicar=${GITHUB_REF_TYPE}" >> "$GITHUB_OUTPUT"

      # O gate de teste do release. Um push de TAG não dispara o ci.yml (que roda
      # em push na main e em pull_request), então é AQUI que a suíte roda antes de
      # publicar — sem isto, um release sairia sem nunca ter sido testado. Já foi
      # carona do `make dist`; virou passo próprio quando o dist passou a só
      # construir, para não pesar em toda build local.
      - name: verify
        run: make verify

      # make dist = binarios (amd64, 386, arm64) + sha256. O teste já rodou acima.
      - name: build
        run: make dist VERSION="${{ steps.ver.outputs.version }}"

      # A RECEITA DE RECONSTRUÇÃO É CONFERIDA AQUI, contra o artefato que acabou
      # de ser compilado.
      #
      # Ela já esteve errada em release publicado: o build usava
      # `VERSION=${GITHUB_REF_NAME#v}` e as notas mandavam
      # `make repro VERSION=${GITHUB_REF_NAME}` — com o `v`. A versão entra no
      # binário por `-ldflags`, então os hashes NÃO PODIAM bater, e nenhum teste
      # do projeto era capaz de perceber: o build passava, a suíte passava, e só
      # quem baixasse o release descobriria.
      #
      # Fora de tag não roda: `git describe --exact-match` não tem o que
      # descrever, e o ensaio não publica receita nenhuma.
      - name: a receita de reconstrução reproduz o release
        if: steps.ver.outputs.publicar == 'tag'
        run: make repro-confere

      # A propriedade que justificou escolher Go, conferida em CADA arquitetura
      # e não só na do runner: um binário dinâmico linka contra a glibc do host
      # e perde a imunidade a LD_PRELOAD e a binário de sistema trojanizado.
      # Sem esta conferência, um `import` novo que puxe cgo passaria batido.
      - name: confirmar que os três binários são estáticos
        run: |
          for b in dist/aletheia-linux-*; do
            file "$b"
            file "$b" | grep -q "statically linked" || {
              echo "FALHA: $b não é estático — algum import puxou cgo" >&2
              exit 1
            }
          done

      # O binário precisa RODAR, não só compilar. É o mesmo argumento do teste
      # que o executa numa imagem `scratch`: prova em runtime, não por inspeção.
      - name: o binário roda e se identifica
        run: |
          chmod +x dist/aletheia-linux-amd64
          ./dist/aletheia-linux-amd64 version
          ./dist/aletheia-linux-amd64 version | grep -q "^aletheia ${{ steps.ver.outputs.version }}$" || {
            echo "FALHA: o binário não reporta a versão que deveria" >&2
            exit 1
          }

      # Os nomes no SHA256SUMS são os NOMES DOS ARQUIVOS, sem diretório: é assim
      # que `sha256sum -c` funciona no diretório em que a pessoa baixou.
      - name: somas
        run: |
          cd dist
          sha256sum aletheia-linux-* > SHA256SUMS
          cat SHA256SUMS

      # ASSINATURA DESTACADA, e ela existe para um caso que a proveniência NÃO
      # cobre: verificação OFFLINE.
      #
      # `gh attestation verify` é a âncora forte, e depende de rede, do CLI do
      # GitHub e do GitHub alcançável. Isso falha exatamente quando mais
      # importa — rede segmentada durante contenção, ambiente isolado, link
      # caído de madrugada. Uma assinatura minisign se verifica com a chave
      # pública que o respondedor carrega, sem consultar ninguém.
      #
      # As duas não competem: a proveniência responde "de qual workflow e de
      # qual commit veio", a assinatura responde "quem publicou isto, e dá para
      # conferir sem rede". Um release quer as duas.
      - name: assinar as somas (minisign)
        id: assinar
        if: steps.ver.outputs.publicar == 'tag'
        env:
          CHAVE: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            # SEM CHAVE O RELEASE SAI, e sai DIZENDO que não tem assinatura.
            # Pular em silêncio publicaria um release indistinguível de um
            # assinado para quem só olha a lista de assets — a mesma classe de
            # mentira por omissão que a ferramenta existe para não cometer.
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            echo "AVISO: MINISIGN_KEY não está configurada — release SEM assinatura destacada" >&2
            exit 0
          fi
          if [ ! -f aletheia.pub ]; then
            echo "FALHA: MINISIGN_KEY existe e aletheia.pub não está no repositório." >&2
            echo "Sem a pública versionada ninguém tem contra o que verificar." >&2
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          # '%s\n' e não '%s': o arquivo de chave do minisign tem duas linhas
          # (comentário + base64), e um segredo colado sem quebra final deixaria
          # a última linha sem terminador. Escrever a quebra é barato; depurar
          # "invalid secret key" dentro de um release não é.
          #
          # O umask vem ANTES da criação: criar com 0644 e corrigir com chmod
          # depois deixa uma janela em que a chave está legível no runner.
          ( umask 077 && printf '%s\n' "$CHAVE" > /tmp/minisign.key )
          # A remoção vai num trap: se a assinatura falhar, a chave não pode
          # ficar no disco do runner esperando o próximo passo.
          trap 'rm -f /tmp/minisign.key' EXIT

          cd dist
          # O comentário confiável é ASSINADO junto: quem verifica lê a tag e o
          # commit de dentro da assinatura, não de um campo que qualquer um
          # reescreve.
          minisign -S -s /tmp/minisign.key -m SHA256SUMS \
            -t "aletheia ${{ steps.ver.outputs.version }} commit ${GITHUB_SHA}"

          # VERIFICAR A PRÓPRIA ASSINATURA antes de publicar: se o segredo não
          # corresponder à pública versionada, o erro aparece aqui e não na
          # máquina de quem vai responder a um incidente.
          minisign -V -p ../aletheia.pub -m SHA256SUMS
          echo "assinado=sim" >> "$GITHUB_OUTPUT"

      # A nota do release carrega a instrução de VERIFICAR. É a primeira coisa
      # que quem baixa vê, e o runbook §16 é explícito: baixar e executar sem
      # conferir é a prática que esta ferramenta existe para desaconselhar.
      - name: nota do release
        run: |
          {
            echo '## Baixar'
            echo
            echo '```sh'
            echo "VER=${GITHUB_REF_NAME}"
            echo 'ARCH=amd64            # amd64 | 386 | arm64'
            echo 'BASE="https://github.com/${{ github.repository }}/releases/download/$VER"'
            echo
            echo 'curl -fsSLO "$BASE/aletheia-linux-$ARCH"'
            echo 'curl -fsSLO "$BASE/SHA256SUMS"'
            echo 'sha256sum --ignore-missing -c SHA256SUMS'
            echo
            echo 'chmod +x "aletheia-linux-$ARCH"'
            echo 'sudo ./aletheia-linux-$ARCH version'
            echo '```'
            echo
            echo 'O sha256 impresso por `aletheia version` tem que ser o mesmo do'
            echo '`SHA256SUMS`. Se não for, pare.'
            echo
            echo '### O que o SHA256SUMS prova, e o que ele NÃO prova'
            echo
            echo 'Ele viaja no MESMO release que os binários. Quem consegue reescrever'
            echo 'um reescreve o outro: a conferência acima pega download corrompido e'
            echo 'troca no caminho, **não** release adulterado.'
            echo
            echo 'Há duas âncoras acima disso, e elas respondem perguntas diferentes.'
            echo
            echo '#### Assinatura destacada — verifica SEM REDE'
            if [ "${{ steps.assinar.outputs.assinado }}" = "sim" ]; then
              echo
              echo 'É a que serve durante um incidente: a chave pública fica no'
              echo 'repositório (`aletheia.pub`), você a carrega junto com o binário, e a'
              echo 'verificação não consulta ninguém.'
              echo
              echo '```sh'
              echo 'curl -fsSLO "$BASE/SHA256SUMS.minisig"'
              echo 'minisign -Vm SHA256SUMS -P '"$(cat aletheia.pub | tail -1)"
              echo 'sha256sum --ignore-missing -c SHA256SUMS'
              echo '```'
              echo
              echo 'O comentário confiável impresso pelo minisign traz a tag e o commit,'
              echo 'e vai ASSINADO junto — não é um campo que se reescreva de fora.'
            else
              echo
              echo '> **Esta release NÃO tem assinatura destacada.** A chave de assinatura'
              echo '> não estava configurada quando ela foi publicada. Use a proveniência'
              echo '> abaixo, que exige rede.'
            fi
            echo
            echo '#### Proveniência — responde DE ONDE veio'
            echo
            echo '```sh'
            echo 'gh attestation verify "aletheia-linux-$ARCH" --owner ${{ github.repository_owner }}'
            echo '```'
            echo
            echo 'Isso responde de onde o binário veio — qual repositório, qual commit,'
            echo 'qual workflow o construiu. Falsificar exige comprometer o GitHub'
            echo 'Actions, não só este release. Exige rede e o CLI `gh`.'
            echo
            echo '#### Reconstruir e conferir — não confia em quem assinou'
            echo
            echo 'O toolchain é fixo no `go.mod` e a identidade da build sai do git, não'
            echo 'do relógio de quem compila: a mesma tag reconstrói byte a byte.'
            echo
            echo '```sh'
            echo "git clone --branch ${GITHUB_REF_NAME} https://github.com/${{ github.repository }}"
            echo "cd aletheia && make repro"
            echo '```'
            echo
            echo 'Os hashes impressos têm que bater com o `SHA256SUMS` acima. É a única'
            echo 'verificação que não pede confiança em nós.'
            echo
            echo 'Binários estáticos, sem dependência: rodam em imagem mínima, sem libc.'
            echo 'Baixe numa máquina limpa e copie para o alvo quando puder — este'
            echo 'binário vira artefato na timeline do host que ele examina.'
            echo
            echo '### Somas'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > dist/NOTAS.md

      # PROVENIÊNCIA: a âncora de confiança que o SHA256SUMS não é.
      #
      # O arquivo de somas viaja no MESMO release que os binários — quem
      # consegue reescrever um reescreve o outro, e a conferência pega corrupção
      # de transporte, não release adulterado. É a mesma distinção que o
      # `conferirSoma` do analyze declara sobre o .sha256 do dump ("o que isto
      # NÃO é: autenticação"), e ela precisa valer também para a porta de
      # entrada da ferramenta.
      #
      # A atestação é assinada pela identidade OIDC deste workflow e guardada
      # FORA dos assets, então falsificá-la exige comprometer o próprio GitHub
      # Actions, não só o release. Quem baixa verifica com
      # `gh attestation verify --owner`.
      - name: atestar a proveniência dos binários
        if: steps.ver.outputs.publicar == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/aletheia-linux-amd64
            dist/aletheia-linux-386
            dist/aletheia-linux-arm64

      - name: publicar
        if: steps.ver.outputs.publicar == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "aletheia ${GITHUB_REF_NAME}" \
            --notes-file dist/NOTAS.md \
            --generate-notes \
            --verify-tag \
            dist/aletheia-linux-amd64 \
            dist/aletheia-linux-386 \
            dist/aletheia-linux-arm64 \
            dist/SHA256SUMS \
            $(ls dist/SHA256SUMS.minisig 2>/dev/null)

      # No ensaio nada é publicado: os artefatos ficam disponíveis para download
      # na própria execução, e é isso que se inspeciona antes de criar a tag.
      - name: guardar artefatos do ensaio
        if: steps.ver.outputs.publicar != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aletheia-ensaio
          path: |
            dist/aletheia-linux-*
            dist/SHA256SUMS
            dist/NOTAS.md
          retention-days: 7
